<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="'Segoe UI', 'Noto Sans JP', sans-serif">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1B4F72"/>
      <stop offset="100%" stop-color="#2E86C1"/>
    </linearGradient>
    <linearGradient id="swGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2C3E50"/>
      <stop offset="100%" stop-color="#34495E"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowSm" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="520" rx="16" fill="#F0F4F8"/>

  <!-- Outer container -->
  <rect x="20" y="20" width="680" height="480" rx="12" fill="white" filter="url(#shadow)" stroke="#D5DBDB" stroke-width="1"/>

  <!-- Header: iPad Safari / PWA -->
  <rect x="20" y="20" width="680" height="44" rx="12" fill="url(#headerGrad)"/>
  <rect x="20" y="48" width="680" height="16" fill="url(#headerGrad)"/>
  <text x="360" y="48" text-anchor="middle" fill="white" font-size="16" font-weight="bold">iPad Safari / PWA</text>

  <!-- App Layer -->
  <!-- React Router box -->
  <rect x="50" y="88" width="160" height="80" rx="8" fill="#EBF5FB" filter="url(#shadowSm)" stroke="#2E86C1" stroke-width="1.5"/>
  <text x="130" y="118" text-anchor="middle" fill="#1B4F72" font-size="13" font-weight="bold">React Router</text>
  <text x="130" y="138" text-anchor="middle" fill="#5D6D7E" font-size="11">(HashRouter)</text>

  <!-- Arrow 1 -->
  <line x1="210" y1="128" x2="260" y2="128" stroke="#2E86C1" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2E86C1"/>
    </marker>
  </defs>

  <!-- Pages box -->
  <rect x="264" y="88" width="160" height="80" rx="8" fill="#EBF5FB" filter="url(#shadowSm)" stroke="#2E86C1" stroke-width="1.5"/>
  <text x="344" y="118" text-anchor="middle" fill="#1B4F72" font-size="13" font-weight="bold">Pages</text>
  <text x="344" y="138" text-anchor="middle" fill="#5D6D7E" font-size="11">Entry / Trial / Comp</text>

  <!-- Arrow 2 -->
  <line x1="424" y1="128" x2="474" y2="128" stroke="#2E86C1" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Pointer Events / Canvas box -->
  <rect x="478" y="88" width="192" height="80" rx="8" fill="#EBF5FB" filter="url(#shadowSm)" stroke="#2E86C1" stroke-width="1.5"/>
  <text x="574" y="112" text-anchor="middle" fill="#1B4F72" font-size="13" font-weight="bold">Pointer Events</text>
  <text x="574" y="132" text-anchor="middle" fill="#1B4F72" font-size="13" font-weight="bold">Canvas</text>
  <text x="574" y="152" text-anchor="middle" fill="#5D6D7E" font-size="11">Apple Pencil</text>

  <!-- Arrow down from Pages to DB -->
  <line x1="344" y1="168" x2="344" y2="210" stroke="#27AE60" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#27AE60"/>
    </marker>
  </defs>

  <!-- Dexie.js (IndexedDB) container -->
  <rect x="50" y="214" width="620" height="130" rx="8" fill="#EAFAF1" filter="url(#shadowSm)" stroke="#27AE60" stroke-width="1.5"/>
  <text x="360" y="240" text-anchor="middle" fill="#1E8449" font-size="14" font-weight="bold">Dexie.js (IndexedDB)</text>

  <!-- sessions box -->
  <rect x="100" y="260" width="200" height="60" rx="6" fill="white" stroke="#27AE60" stroke-width="1"/>
  <text x="200" y="286" text-anchor="middle" fill="#1E8449" font-size="13" font-weight="bold">sessions</text>
  <text x="200" y="306" text-anchor="middle" fill="#5D6D7E" font-size="11">セッション管理</text>

  <!-- Double arrow between sessions and memoRecords -->
  <line x1="300" y1="290" x2="380" y2="290" stroke="#27AE60" stroke-width="2"/>
  <polygon points="308,286 300,290 308,294" fill="#27AE60"/>
  <polygon points="372,286 380,290 372,294" fill="#27AE60"/>

  <!-- memoRecords box -->
  <rect x="384" y="260" width="240" height="60" rx="6" fill="white" stroke="#27AE60" stroke-width="1"/>
  <text x="504" y="286" text-anchor="middle" fill="#1E8449" font-size="13" font-weight="bold">memoRecords</text>
  <text x="504" y="306" text-anchor="middle" fill="#5D6D7E" font-size="11">採点メモ (StrokeData)</text>

  <!-- Service Worker bar -->
  <rect x="50" y="368" width="620" height="56" rx="8" fill="#2C3E50" filter="url(#shadowSm)"/>
  <text x="360" y="393" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Service Worker (Workbox)</text>
  <text x="360" y="412" text-anchor="middle" fill="#AEB6BF" font-size="11">静的アセット precache + Google Fonts CacheFirst</text>

  <!-- Offline badge -->
  <rect x="220" y="448" width="280" height="36" rx="18" fill="#E74C3C" filter="url(#shadowSm)"/>
  <text x="360" y="472" text-anchor="middle" fill="white" font-size="13" font-weight="bold">サーバー通信: なし（完全オフライン）</text>
</svg>
