<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D680"/>
      <stop offset="25%" stop-color="#E8C252"/>
      <stop offset="50%" stop-color="#D4A830"/>
      <stop offset="75%" stop-color="#C49A2C"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="30%" stop-color="#E8C252"/>
      <stop offset="100%" stop-color="#A07818"/>
    </linearGradient>
    <linearGradient id="penBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D470"/>
      <stop offset="30%" stop-color="#D4A830"/>
      <stop offset="70%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#8C6410"/>
    </linearGradient>
    <linearGradient id="penNib" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="50%" stop-color="#E8C252"/>
      <stop offset="100%" stop-color="#C49A2C"/>
    </linearGradient>
    <linearGradient id="writtenText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D680"/>
      <stop offset="40%" stop-color="#E8C252"/>
      <stop offset="100%" stop-color="#D4A830"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#101E38"/>
      <stop offset="100%" stop-color="#050A14"/>
    </radialGradient>
    <clipPath id="sq">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
    <filter id="penShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nibGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="#050A14"/>
    <rect width="512" height="512" fill="url(#bgGlow)"/>
  </g>

  <g clip-path="url(#sq)">

    <!-- "MAG" -->
    <g filter="url(#textGlow)">

      <!-- M -->
      <path d="M 30 410
               L 42 110
               L 95 300
               L 148 110
               L 160 410"
        fill="none" stroke="url(#writtenText)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- A -->
      <path d="M 185 410
               L 240 110
               L 295 410"
        fill="none" stroke="url(#writtenText)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Crossbar -->
      <path d="M 203 300 L 277 300"
        fill="none" stroke="url(#writtenText)" stroke-width="10" stroke-linecap="round"/>

      <!-- G -->
      <path d="M 430 155
               C 410 110, 365 95, 340 115
               C 310 140, 305 210, 310 280
               C 315 340, 340 400, 380 415
               C 410 425, 440 410, 450 380
               L 450 290
               L 395 290"
        fill="none" stroke="url(#writtenText)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- PEN -->
    <g filter="url(#penShadow)">

      <!-- Cap finial -->
      <circle cx="498" cy="52" r="5.5" fill="#7A5A0A"/>

      <!-- Cap -->
      <line x1="496" y1="58" x2="488" y2="80"
        stroke="#7A5A0A" stroke-width="16" stroke-linecap="round"/>

      <!-- Pen body -->
      <line x1="488" y1="80" x2="418" y2="248"
        stroke="url(#penBody)" stroke-width="14" stroke-linecap="round"/>

      <!-- Body highlight -->
      <line x1="484" y1="90" x2="417" y2="244"
        stroke="#FFF1C8" stroke-width="2.5" stroke-linecap="round" opacity="0.22"/>

      <!-- Clip -->
      <path d="M 498 72 L 502 52"
        fill="none" stroke="#C49A2C" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

      <!-- Upper band -->
      <line x1="480" y1="108" x2="484" y2="98"
        stroke="#FFF5D6" stroke-width="3" stroke-linecap="round" opacity="0.45"/>

      <!-- Lower band -->
      <line x1="435" y1="214" x2="439" y2="204"
        stroke="#FFF5D6" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

      <!-- Nib section -->
      <line x1="418" y1="248" x2="407" y2="270"
        stroke="url(#penNib)" stroke-width="10" stroke-linecap="round"/>

      <!-- Nib taper -->
      <line x1="407" y1="270" x2="400" y2="284"
        stroke="url(#penNib)" stroke-width="6" stroke-linecap="round"/>

      <!-- Nib tip -->
      <line x1="400" y1="284" x2="397" y2="290"
        stroke="#FFF5D6" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Ink glow at nib -->
    <g filter="url(#nibGlow)">
      <circle cx="396" cy="291" r="5" fill="#E8C252" opacity="0.6"/>
    </g>
    <circle cx="396" cy="291" r="2.5" fill="#FFF5D6" opacity="0.9"/>

    <!-- ACCENTS -->

    <!-- Underline swoosh -->
    <path d="M 35 438 C 130 455, 280 460, 440 435"
      fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" opacity="0.25"/>

    <!-- Stars -->
    <g transform="translate(260, 65)" opacity="0.3">
      <path d="M 0 -11 L 3 -3.5 L 11 -3.5 L 5 2 L 7 10 L 0 5.5 L -7 10 L -5 2 L -11 -3.5 L -3 -3.5 Z"
        fill="url(#goldShine)"/>
    </g>

    <!-- Sparkles -->
    <circle cx="60" cy="70" r="2.5" fill="#E8C252" opacity="0.25"/>
    <circle cx="480" cy="440" r="2" fill="#D4A830" opacity="0.2"/>
    <circle cx="170" cy="65" r="2" fill="#FFF1C8" opacity="0.18"/>

    <!-- Motion arcs near pen -->
    <path d="M 410 305 C 420 298, 435 296, 445 300"
      fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" opacity="0.18"/>
    <path d="M 415 320 C 425 314, 438 312, 446 315"
      fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-linecap="round" opacity="0.1"/>

  </g>
</svg>
